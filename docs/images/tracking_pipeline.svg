<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Command-guided pan tilt tracking pipeline</title>
  <desc id="desc">Architecture diagram showing how text commands, Gazebo camera images, detection, target ranking, and pan tilt control connect.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1000" height="430" fill="#f8faf9"/>
  <text x="42" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e2a34">Command-Guided Visual Tracking Pipeline</text>
  <text x="42" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64707c">The camera is not scripted from object positions; it uses rendered camera frames, parses the command, ranks visible targets, and publishes bounded pan/tilt commands.</text>

  <!-- Input row -->
  <g filter="url(#shadow)">
    <rect x="42" y="100" width="210" height="86" rx="8" fill="#ffffff" stroke="#ccd6dd"/>
    <rect x="296" y="100" width="210" height="86" rx="8" fill="#ffffff" stroke="#ccd6dd"/>
    <rect x="550" y="100" width="210" height="86" rx="8" fill="#ffffff" stroke="#ccd6dd"/>
  </g>
  <text x="65" y="128" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2e3b46">Runtime command</text>
  <text x="65" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">runtime_command.txt</text>
  <text x="65" y="169" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">Example: track the red person</text>

  <text x="319" y="128" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2e3b46">Gazebo camera frames</text>
  <text x="319" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">/world/room_427/.../camera/image</text>
  <text x="319" y="169" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">Rendered RGB/BGR images</text>

  <text x="573" y="128" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2e3b46">Optional VLM / speech</text>
  <text x="573" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">VLM JSON or audio file path</text>
  <text x="573" y="169" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">Merges with rule parser</text>

  <!-- Processing row -->
  <g filter="url(#shadow)">
    <rect x="112" y="242" width="190" height="86" rx="8" fill="#fdfefe" stroke="#ccd6dd"/>
    <rect x="360" y="242" width="190" height="86" rx="8" fill="#fdfefe" stroke="#ccd6dd"/>
    <rect x="608" y="242" width="190" height="86" rx="8" fill="#fdfefe" stroke="#ccd6dd"/>
  </g>
  <text x="132" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2e3b46">Command parser</text>
  <text x="132" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">action, label, color, region</text>
  <text x="132" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">speed and track ID hints</text>

  <text x="380" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2e3b46">Detector</text>
  <text x="380" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">color-proxy default</text>
  <text x="380" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">YOLO optional</text>

  <text x="628" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2e3b46">Target selector</text>
  <text x="628" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">ranks candidates by command match</text>
  <text x="628" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">uses hysteresis to avoid switching</text>

  <!-- Output row -->
  <g filter="url(#shadow)">
    <rect x="796" y="242" width="160" height="86" rx="8" fill="#fff8df" stroke="#e4c763"/>
    <rect x="360" y="360" width="280" height="44" rx="8" fill="#eaf3ff" stroke="#9bbce5"/>
  </g>
  <text x="816" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2e3b46">Pan/tilt controller</text>
  <text x="816" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">deadband + bounded steps</text>
  <text x="816" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">pan +/-45, tilt 0-45 deg</text>

  <text x="393" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#264b76">Gazebo pan_joint / tilt_joint command topics</text>

  <!-- Arrows -->
  <path d="M147 186 C147 215 172 226 207 240" fill="none" stroke="#34495e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M401 186 C407 213 424 225 455 240" fill="none" stroke="#34495e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M655 186 C601 211 568 224 525 244" fill="none" stroke="#34495e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M302 285 L358 285" fill="none" stroke="#34495e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M550 285 L606 285" fill="none" stroke="#34495e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M798 285 L794 285" fill="none" stroke="#34495e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M876 328 C833 377 719 384 641 384" fill="none" stroke="#34495e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M406 360 C330 325 292 252 319 180" fill="none" stroke="#6f879b" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <text x="310" y="221" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#607080">image observations</text>
  <text x="779" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#607080">best target + image error</text>
  <text x="270" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#607080">closed loop: new camera view changes next frame</text>

  <!-- Bottom note -->
  <rect x="42" y="358" width="260" height="46" rx="8" fill="#ffffff" stroke="#d8dee3"/>
  <text x="62" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#2e3b46">Default demo path</text>
  <text x="62" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606c">color-proxy detector + Room 427 Gazebo camera</text>
</svg>
